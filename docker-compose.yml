services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
    # En Linux (VPS), antes del primer `docker compose up`: mkdir -p data && sudo chown 1000:1000 data
    # El contenedor corre como uid 1000 y necesita escribir en data/.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Login manual en Fiwind (README, "Login manual"). No arranca con `up`:
  # docker compose --profile login run --rm --service-ports fiwind-login
  fiwind-login:
    build:
      context: .
      target: login
    profiles: ["login"]
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./data:/app/data
    # Solo en el loopback de la VM: se llega por un túnel SSH.
    ports:
      - "127.0.0.1:6080:6080"
