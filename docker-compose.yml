services:
  app:
    build: .
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
    # En Linux (VPS), antes del primer `docker compose up`: mkdir -p data && sudo chown 1000:1000 data
    # El contenedor corre como uid 1000 y necesita escribir en data/.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
